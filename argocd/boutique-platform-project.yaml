apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: boutique-platform
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: boutique-platform
spec:
  description: "Restricted GitOps project for Online Boutique and observability resources"

  sourceRepos:
    - https://github.com/Asfand543/microservices-demo.git

  destinations:
    - namespace: boutique
      server: https://kubernetes.default.svc
    - namespace: monitoring
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc

  clusterResourceWhitelist:
    - group: ""
      kind: Namespace

  namespaceResourceWhitelist:
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: "apps"
      kind: Deployment
    - group: "autoscaling"
      kind: HorizontalPodAutoscaler
    - group: "monitoring.coreos.com"
      kind: ServiceMonitor
    - group: "monitoring.coreos.com"
      kind: PrometheusRule
